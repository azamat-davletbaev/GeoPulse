<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoPulse — карта скважин Volve</title>
  <!-- Стили и библиотеки — только локальные vendor-файлы (web/vendor/): Leaflet (карта),
       ECharts (графики), Inter (шрифт подключается в style.css). Внешних CDN нет:
       единственные сетевые запросы страницы — тайлы карты Esri. -->
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <a class="brand" href="/" aria-label="GeoPulse — на главную">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        <span class="brand-name">GeoPulse</span>
      </a>
      <span class="subtitle">Месторождение Volve — интерактивная карта скважин</span>
    </div>
    <nav class="topnav" aria-label="Основная навигация">
      <a href="/">Карта</a>
      <a href="/reports.html">Отчёты</a>
      <a href="/forecast.html">Прогноз</a>
      <a href="/about.html">О проекте</a>
    </nav>
  </header>

  <!-- Класс data-pending стоит в разметке: панели слоёв рождаются прозрачными
       (без анимации «проявление → исчезновение»), а app.js снимает его после
       вводного полёта — данные проявляются fade-in 400 мс (style.css). -->
  <main id="map" class="data-pending" aria-label="Карта скважин"></main>

  <aside id="panel" class="panel" aria-hidden="true" aria-label="Скважина: график и сводка">
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close" type="button" aria-label="Закрыть панель">&times;</button>
    </div>
    <!-- Панель скроллится целиком: график, сводка и список скважин не влезают в экран. -->
    <div class="panel-scroll">
      <div class="panel-body">
        <div id="chart" class="panel-chart"></div>
        <div id="chart-skeleton" class="skeleton panel-chart-skeleton"></div>
      </div>
      <p id="panel-error" class="panel-error" hidden></p>
      <!-- Сводка скважины: те же поля, что были в попапе Leaflet. -->
      <section id="well-summary" class="well-summary" hidden></section>
      <!-- Список всех скважин: устья куста не разлепляются на рабочих зумах. -->
      <section class="panel-list-block">
        <h3 class="panel-section-title">Скважины</h3>
        <ul id="well-list" class="well-list"></ul>
      </section>
    </div>
  </aside>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/echarts.min.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
