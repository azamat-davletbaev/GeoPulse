<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoPulse — карта скважин Volve</title>
  <!-- Leaflet 1.9.4 и Chart.js 4.4.1 лежат локально в web/vendor/ (те же версии,
       что раньше отдавали CDN), поэтому JS/CSS работают без доступа в интернет.
       Сетевыми остаются только тайлы карты tile.openstreetmap.org.
       Структура vendor/leaflet/ повторяет dist Leaflet: leaflet.css ссылается
       на images/marker-icon.png относительным путём. -->
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>GeoPulse</h1>
    <nav class="topnav">
      <a href="/" class="active">Карта</a>
      <a href="/reports.html">Отчёты</a>
    </nav>
    <span class="subtitle">Месторождение Volve — интерактивная карта скважин</span>
  </header>

  <main id="map" aria-label="Карта скважин"></main>

  <aside id="panel" class="panel" aria-hidden="true">
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close" type="button" aria-label="Закрыть панель">&times;</button>
    </div>
    <div class="panel-body">
      <canvas id="chart"></canvas>
    </div>
    <p id="panel-error" class="panel-error" hidden></p>
  </aside>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/chartjs/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
