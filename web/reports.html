<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoPulse — отчёты по месторождению Volve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/reports.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="GeoPulse — на главную">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
      <span class="brand-name">GeoPulse</span>
    </a>
    <span class="subtitle">Месторождение Volve — отчёты по добыче</span>
    <nav class="topnav" aria-label="Основная навигация">
      <a href="/">Карта</a>
      <a href="/reports.html">Отчёты</a>
      <a href="/forecast.html">Прогноз</a>
      <a href="/about.html">О проекте</a>
    </nav>
  </header>

  <main class="reports">
    <section class="toolbar">
      <h2>Отчёт по месторождению</h2>
      <div class="actions">
        <a class="button" href="/api/Reports/monthly.xlsx">Скачать Excel</a>
        <a class="button button-secondary" href="/api/Reports/monthly.csv">Скачать CSV</a>
      </div>
    </section>

    <section class="card">
      <h3>Сводка</h3>
      <div id="summary-skeleton" class="skeleton-block">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <table id="summary" class="summary-table" hidden>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h3>Добыча по месяцам (по месторождению)</h3>
      <div class="chart-wrap">
        <div id="monthlyChart" class="chart-host"></div>
        <div id="monthlyChart-skeleton" class="skeleton"></div>
      </div>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="/common.js"></script>
  <script src="/reports.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
