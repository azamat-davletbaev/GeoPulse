<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoPulse — прогноз добычи Volve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/forecast.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="GeoPulse — на главную">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
      <span class="brand-name">GeoPulse</span>
    </a>
    <span class="subtitle">Месторождение Volve — прогноз добычи</span>
    <nav class="topnav" aria-label="Основная навигация">
      <a href="/">Карта</a>
      <a href="/reports.html">Отчёты</a>
      <a href="/forecast.html">Прогноз</a>
      <a href="/about.html">О проекте</a>
    </nav>
  </header>

  <main class="forecast">
    <section class="toolbar">
      <h2>Прогноз добычи</h2>
      <div class="controls">
        <div class="segmented" role="group" aria-label="Область прогноза">
          <button type="button" id="scope-field" class="segmented-btn active">По месторождению</button>
          <button type="button" id="scope-well" class="segmented-btn">По скважине</button>
        </div>
        <select id="well-select" class="select" hidden aria-label="Скважина"></select>
      </div>
    </section>

    <section class="card">
      <h3>Добыча — факт и прогноз</h3>
      <div class="chart-wrap">
        <div id="forecastChart" class="chart-host"></div>
        <div id="forecastChart-skeleton" class="skeleton"></div>
      </div>
    </section>

    <section id="forecast-placeholder" class="card placeholder" hidden>
      <h3>Прогноз недоступен</h3>
      <p>ML-сервис прогноза ещё не развёрнут или временно недоступен. Фактическая добыча показана выше.</p>
      <button type="button" id="retry" class="button">Повторить</button>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="/common.js"></script>
  <script src="/forecast.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
