name: CD — build & push to ghcr

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webapi
            dockerfile: src/GeoPulse.WebAPI/Dockerfile
          - name: consumer
            dockerfile: src/GeoPulse.Consumer/Dockerfile
          - name: chingest
            dockerfile: src/GeoPulse.CHIngest/Dockerfile
          - name: aggregator
            dockerfile: src/GeoPulse.Aggregator/Dockerfile
          - name: ingestion
            dockerfile: src/GeoPulse.Ingestion.Service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Теги: короткий SHA (повторяемая привязка к коммиту, для отката) + latest
          # («текущая» версия). Сервер пулит latest; для отката — конкретный короткий SHA.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/geopulse-${{ matrix.name }}:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/geopulse-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
