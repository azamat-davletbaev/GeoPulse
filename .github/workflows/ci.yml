name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    # ubuntu-latest уже содержит Docker, поэтому Testcontainers-тесты
    # (Postgres, Kafka, ClickHouse) выполняются в том же job — отдельный job
    # для них не нужен и только увеличил бы время прогона.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GeoPulse.slnx

      - name: Verify code style
        # Стиль зафиксирован в .editorconfig; сборка не падает на предупреждениях,
        # поэтому соответствие проверяется отдельным шагом.
        run: dotnet format GeoPulse.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GeoPulse.slnx -c Release --no-restore

      - name: Verify EF model matches migrations
        # Ловит ситуацию «модель поменяли, миграцию не добавили» (Consumer применяет миграции на старте).
        run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project src/GeoPulse.Infrastructure

      - name: Test
        run: dotnet test tests/GeoPulse.Tests/GeoPulse.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore

  frontend-check:
    # Отдельный job: проверка клиентской логики web/app.js не требует .NET и не
    # влияет на прогон dotnet test (это не xUnit-тест, а стенд на заглушках Leaflet).
    name: Frontend check (web/app.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Layers and initial view (mixed data)
        run: node tests/frontend/webapp-check.js mixed

      - name: Neutral view without valid coordinates (empty data)
        run: node tests/frontend/webapp-check.js empty
