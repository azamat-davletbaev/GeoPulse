# Прод-стек GeoPulse.
# Постоянный состав (docker compose up -d): postgres, kafka, clickhouse,
# consumer, chingest, webapi, caddy.
# Ingestion — одноразовый запуск (docker compose run --rm ingestion), в постоянный
# состав не входит (профиль "init").
#
# Метрики (prometheus, grafana, node-exporter) — профиль "observability":
# обычный `docker compose up -d` их НЕ поднимает, и deploy.sh про них не знает
# (он проверяет фиксированный список CORE_CONTAINERS из 7 сервисов).
# Запуск/остановка по требованию:
#   docker compose -f docker-compose.prod.yml --profile observability up -d
#   docker compose -f docker-compose.prod.yml stop prometheus grafana node-exporter
#   docker compose -f docker-compose.prod.yml rm -f prometheus grafana node-exporter
# (`down` здесь не используем: он останавливает весь проект, включая основной стек).
#
# Переменные окружения берутся из файла .env (см. .env.example). Секреты — в .env,
# в репозиторий не коммитятся.
# Тег образов приложения — DOCKER_TAG (latest или короткий SHA коммита);
# его обновляет deploy.sh при каждом релизе, вручную — для отката.

services:
  postgres:
    image: postgres:17-alpine
    container_name: geopulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geopulse_core}
      POSTGRES_USER: ${POSTGRES_USER:-geopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Скромный лимит: БД небольшая (15 тыс. строк добычи + справочники).
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geopulse} -d ${POSTGRES_DB:-geopulse_core}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем — Postgres доступен только внутри compose-сети.

  kafka:
    image: apache/kafka:4.0.0
    container_name: geopulse-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Топики создаются автоматически при первом обращении; 3 партиции — каноническое
      # значение для production-daily (совпадает с README).
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Ограничение heap JVM (сервер 2 ГБ RAM).
      KAFKA_HEAP_OPTS: "-Xmx384m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/29092'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    # Порт наружу не публикуем.
    volumes:
      - kafkadata:/tmp/kafka-logs

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: geopulse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-gp}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-geopulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD не задан в .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - chdata:/var/lib/clickhouse
      # Внутренний лимит памяти ClickHouse ≈ 600 МБ (см.
      # observability/clickhouse/max_server_memory_usage.xml). Отдельный файл в
      # config.d читается поверх config.xml при старте; том chdata не меняется,
      # поэтому `docker compose up -d clickhouse` (пересоздание контейнера) не
      # приводит к потере данных.
      - ./observability/clickhouse/max_server_memory_usage.xml:/etc/clickhouse-server/config.d/max_server_memory_usage.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # Ограничение памяти ClickHouse (сервер 2 ГБ RAM).
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Порт наружу не публикуем.

  consumer:
    image: ghcr.io/${OWNER:-azamat-davletbaev}/geopulse-consumer:${DOCKER_TAG:-latest}
    container_name: geopulse-consumer
    restart: unless-stopped
    environment:
      ConnectionStrings__CoreDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-geopulse_core};Username=${POSTGRES_USER:-geopulse};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: production-daily
      Kafka__DlqTopic: production-daily-dlq
    # 256m — общий бюджет .NET-сервисов: рабочий набор маленький, лимит держим
    # как запас под GC при пиковой нагрузке (сервер 2 ГБ RAM).
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  chingest:
    image: ghcr.io/${OWNER:-azamat-davletbaev}/geopulse-chingest:${DOCKER_TAG:-latest}
    container_name: geopulse-chingest
    restart: unless-stopped
    environment:
      ConnectionStrings__CoreDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-geopulse_core};Username=${POSTGRES_USER:-geopulse};Password=${POSTGRES_PASSWORD}
      ClickHouse__ConnectionString: Host=clickhouse;Port=8123;Database=${CLICKHOUSE_DB:-gp};Username=${CLICKHOUSE_USER:-geopulse};Password=${CLICKHOUSE_PASSWORD}
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: production-daily
      Kafka__DlqTopic: production-daily-dlq
    # Тот же бюджет 256m, что у consumer: пакетная запись в ClickHouse даёт
    # всплески аллокаций — лимит оставляет запас под GC.
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  webapi:
    image: ghcr.io/${OWNER:-azamat-davletbaev}/geopulse-webapi:${DOCKER_TAG:-latest}
    container_name: geopulse-webapi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5146
      ConnectionStrings__CoreDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-geopulse_core};Username=${POSTGRES_USER:-geopulse};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__ClickHouse: Host=clickhouse;Port=8123;Database=${CLICKHOUSE_DB:-gp};Username=${CLICKHOUSE_USER:-geopulse};Password=${CLICKHOUSE_PASSWORD}
    # 256m, как у consumer/chingest: запас под GC и JIT в пике — отчёты
    # (xlsx/csv) и агрегаты по добыче собираются в памяти.
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # Проверка работоспособности через «живой» эндпоинт: GET /health отвечает
    # 200 + {"database":"up"} либо 503 + {"database":"down"} (см.
    # src/GeoPulse.WebAPI/Controllers/HealthController.cs). Код 503 от curl -f
    # считается неуспехом — контейнер помечается unhealthy.
    # В образе aspnet:10.0 нет ни curl, ни wget, поэтому curl устанавливается в
    # src/GeoPulse.WebAPI/Dockerfile (final-стадия).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:5146/health"]
      # Интервал не меньше 10 с: каждый /health делает пробный запрос в PostgreSQL.
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Порт наружу не публикуем — наружу смотрит только Caddy (80/443).

  caddy:
    image: caddy:2.8-alpine
    container_name: geopulse-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN не задан в .env (DuckDNS-домен)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    # 64m: прокси держит в памяти только TLS-сертификаты, буферы и файл журнала.
    # Отдельный потолок не даёт Caddy вытеснить память у сервисов приложения.
    mem_limit: 64m
    depends_on:
      - webapi

  # Одноразовый импорт данных: docker compose run --rm ingestion.
  # В постоянный состав (docker compose up -d) не входит благодаря профилю "init".
  ingestion:
    image: ghcr.io/${OWNER:-azamat-davletbaev}/geopulse-ingestion:${DOCKER_TAG:-latest}
    profiles: ["init"]
    environment:
      # Пути к данным (Volve:ProductionWorkbook / Volve:WellboreRoot) запечены в образ
      # и берутся из appsettings.json; переопределяем только адрес Kafka.
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # --- НАБЛЮДАЕМОСТЬ (профиль "observability", по умолчанию выключен) ---
  # Все три сервиса помечены profiles: ["observability"], поэтому:
  #   * `docker compose -f docker-compose.prod.yml up -d` их не поднимает;
  #   * deploy.sh их не тянет и не проверяет (CORE_CONTAINERS — 7 сервисов);
  #   * наружу ничего не публикуется, кроме loopback-порта Grafana (SSH-туннель).
  # Образы закреплены по тегам (не latest — иначе обновление могло бы сломать
  # совместимость конфигов); у каждого контейнера обязательный mem_limit
  # (сервер 2 ГБ RAM + 2 ГБ swap).

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: geopulse-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Ретеншн 7 дней: данных больше не нужно, диск 32 ГБ общий с данными стека.
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.path=/prometheus"
      # Позволяет применить правку prometheus.yml без пересоздания контейнера:
      # curl -X POST http://127.0.0.1:9090/-/reload (изнутри контейнера).
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    # node-exporter живёт в host-сети (у него нет имени в compose-сети), поэтому
    # Prometheus ходит к нему по host.docker.internal -> host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    healthcheck:
      # В образе prom/prometheus есть только busybox (curl нет) — проверяем wget'ом.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Порт наружу не публикуем: Prometheus нужен только Grafana (внутри сети).

  grafana:
    image: grafana/grafana:11.3.0
    container_name: geopulse-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Пароль берётся из .env. Значение по умолчанию "admin" выбрано осознанно:
      # `${VAR:?}` сделал бы невалидным compose-файл и без профиля (интерполяция
      # выполняется всегда), то есть сломал бы deploy.sh на .env без этой строки.
      # Риск низкий: порт Grafana привязан к 127.0.0.1 (см. ports ниже), снаружи
      # доступа нет. Задайте надёжный пароль в .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Демо-стенд: самостоятельная регистрация пользователей запрещена.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Не шлём телеметрию и не проверяем обновления (лишний трафик/CPU на 1 vCPU).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Provisioning datasource'ов (Prometheus) — файл в git, UI не правим.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Наружу НЕ публикуем: порт привязан к loopback сервера, поэтому снаружи
      # недоступен даже при открытом UFW. Доступ — через SSH-туннель:
      #   ssh -L 3000:127.0.0.1:3000 deploy@<SERVER_IP>
      - "127.0.0.1:3000:3000"
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: geopulse-node-exporter
    profiles: ["observability"]
    restart: unless-stopped
    # Метрики нужны ХОСТА, а не контейнера: host network + host pid + маунты
    # /proc, /sys и корня ФС только на чтение.
    network_mode: host
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    # Скромный лимит: экспортёр сам по себе почти не потребляет память.
    mem_limit: 64m
    # Healthcheck невозможен: образ собран «с нуля» (в нём только бинарь
    # node_exporter, нет ни sh, ни wget/curl), поэтому статус контейнера —
    # running, а живучесть проверяется метрикой up{job="node-exporter"} в
    # Prometheus (или curl с хоста: curl -fsS http://127.0.0.1:9100/metrics).
    # Порт 9100 слушает хост, но наружу закрыт: UFW пропускает только 22/80/443.

volumes:
  pgdata:
  chdata:
  caddy_data:
  caddy_config:
  # Данные Prometheus (TSDB, ретеншн 7 дней) и Grafana (пользователи, дашборды).
  # Отдельные тома — чтобы `down` профиля не терял историю метрик и настройки.
  promdata:
  grafana_data:
  kafkadata: